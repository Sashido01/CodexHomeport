name: Native profile security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-profile:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2, pinned
        with:
          persist-credentials: false
      - name: Python isolated tests
        run: python -m unittest discover -s tests -v
      - name: Public tracked-tree guard
        run: python scripts/check-public-tree.py
  powershell-native:
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2, pinned
        with:
          persist-credentials: false
      - name: PowerShell parsing and synthetic profile restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null; $errors = $null
          foreach ($file in @('scripts/homeport.ps1','scripts/homeport-menu.ps1','scripts/bootstrap.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          }
          $root = Join-Path $env:RUNNER_TEMP ('fake-home-' + [guid]::NewGuid().ToString('N'))
          $codex = Join-Path $root '.codex'
          New-Item -ItemType Directory -Path $codex -Force | Out-Null
          'model = "test-model"' | Set-Content -LiteralPath (Join-Path $codex 'config.toml')
          & ./scripts/homeport.ps1 -Action Version
          & ./scripts/homeport.ps1 -Action Status -UserHome $root
          $snapshot = Join-Path $env:RUNNER_TEMP ('snapshot-' + [guid]::NewGuid().ToString('N'))
          & ./scripts/homeport.ps1 -Action Backup -UserHome $root -BackupDir $snapshot
          & ./scripts/homeport.ps1 -Action Verify -BackupDir $snapshot
          'changed = true' | Set-Content -LiteralPath (Join-Path $codex 'config.toml')
          & ./scripts/homeport.ps1 -Action Restore -UserHome $root -BackupDir $snapshot
          if ((Get-Content -LiteralPath (Join-Path $codex 'config.toml') -Raw) -notmatch 'changed = true') { throw 'Dry-run changed target' }
          & ./scripts/homeport.ps1 -Action Restore -UserHome $root -BackupDir $snapshot -Apply
          if ((Get-Content -LiteralPath (Join-Path $codex 'config.toml') -Raw) -notmatch 'test-model') { throw 'Restore is incorrect' }
      - name: Extended fail-closed PowerShell acceptance
        shell: pwsh
        run: pwsh -NoProfile -File tests/test_homeport.ps1
      - name: Isolated Windows bootstrap
        shell: pwsh
        run: pwsh -NoProfile -File tests/test_bootstrap.ps1
  docs-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned
        with:
          persist-credentials: false
      - name: Check paired documentation and microversion
        run: python3 scripts/check-docs.py
